name: windows-native
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  g0-windows:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: microsoft/setup-msbuild@v2

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --info
          cmake --version
          msbuild -version
          $ver = (cmake --version | Select-Object -First 1)
          if ($ver -notmatch 'version (3\.(2[8-9]|[3-9]\d)|[4-9])') {
            throw "CMake 3.28+ required, got $ver"
          }

      - name: Restore solution
        run: dotnet restore LuminaArchive.sln --configfile nuget.config

      - name: Restore WinUI win-x64 runtime pack
        run: dotnet restore apps/win/Lumina.Win.csproj --configfile nuget.config -r win-x64

      - name: Build solution (Release x64)
        run: dotnet build LuminaArchive.sln -c Release -p:Platform=x64 --no-restore

      - name: Build Domain
        run: dotnet build src/domain/Lumina.Domain.csproj -c Release --no-restore

      - name: Build Supervisor
        run: dotnet build src/supervisor/Lumina.Supervisor.csproj -c Release --no-restore

      - name: Build CLI
        run: dotnet build apps/cli/Lumina.Cli.csproj -c Release --no-restore

      - name: Build Tests
        run: dotnet build tests/Lumina.Domain.Tests/Lumina.Domain.Tests.csproj -c Release --no-restore

      - name: Build Supervisor tests
        run: dotnet build tests/Lumina.Supervisor.Tests/Lumina.Supervisor.Tests.csproj -c Release --no-restore

      - name: Build WinUI skeleton
        run: dotnet build apps/win/Lumina.Win.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 --no-restore

      - name: Run Domain tests
        run: dotnet test tests/Lumina.Domain.Tests/Lumina.Domain.Tests.csproj -c Release --no-restore --no-build

      - name: Configure windows-x64-release
        run: cmake --preset windows-x64-release

      - name: Configure windows-arm64-release
        run: cmake --preset windows-arm64-release

      - name: MSVC build lumina-engine
        run: cmake --build --preset windows-x64-release --target lumina-engine --config Release

      - name: MSVC build lumina-ipc-parse-test
        run: cmake --build --preset windows-x64-release --target lumina-ipc-parse-test --config Release

      - name: Run native IPC JSON parser tests
        run: .\build\win-x64-release\native\engine\Release\lumina-ipc-parse-test.exe

      - name: MSVC build lumina-preview
        run: cmake --build --preset windows-x64-release --target lumina-preview --config Release

      - name: MSVC build lumina-shell
        run: cmake --build --preset windows-x64-release --target lumina-shell --config Release

      - name: MSVC build lumina-7z-adapter
        run: cmake --build --preset windows-x64-release --target lumina-7z-adapter --config Release

      - name: MSVC build lumina-7z-adapter-test
        run: cmake --build --preset windows-x64-release --target lumina-7z-adapter-test --config Release

      - name: Fetch official 7z.dll x64
        shell: pwsh
        run: ./eng/fetch-7zip-runtime.ps1 -Arch x64

      - name: Stage 7z.dll next to engine
        shell: pwsh
        run: |
          $dst = "build/win-x64-release/native/engine/Release"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item runtime/7zip/x64/7z.dll $dst -Force
          Copy-Item runtime/7zip/x64/7z.dll build/win-x64-release/native/7z-adapter/Release/ -Force

      - name: Adapter unit/integration (plain 7z + zip)
        shell: pwsh
        run: |
          $dll = Resolve-Path runtime/7zip/x64/7z.dll
          $exe = "build/win-x64-release/native/7z-adapter/Release/lumina-7z-adapter-test.exe"
          & $exe $dll tests/fixtures/g3/plain.7z
          if ($LASTEXITCODE -ne 0) { throw "plain.7z adapter test failed" }
          & $exe $dll tests/fixtures/g3/plain.zip
          if ($LASTEXITCODE -ne 0) { throw "plain.zip adapter test failed" }
          & $exe $dll tests/fixtures/g3/random.bin
          # non-archive returns 0 from adapter-test when status is NotArchive


      - name: MSVC build lumina-bench-run (G1 helper, not product)
        run: cmake --build --preset windows-x64-release --target lumina-bench-run --config Release

      - name: MSVC ARM64 build lumina-engine
        run: cmake --build --preset windows-arm64-release --target lumina-engine --config Release

      - name: MSVC ARM64 build lumina-7z-adapter
        run: cmake --build --preset windows-arm64-release --target lumina-7z-adapter --config Release

      - name: Fetch official 7z.dll ARM64 (stage/inspect only)
        shell: pwsh
        run: ./eng/fetch-7zip-runtime.ps1 -Arch arm64

      - name: Inspect ARM64 7z.dll PE machine
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("runtime/7zip/arm64/7z.dll")
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0xAA64) { throw "ARM64 7z.dll machine $machine" }
          Write-Host "ARM64 7z.dll IMAGE_FILE_MACHINE_ARM64 OK"

      - name: Run Supervisor tests including G2 Windows integration
        env:
          LUMINA_ENGINE: ${{ github.workspace }}\build\win-x64-release\native\engine\Release\lumina-engine.exe
        run: dotnet test tests/Lumina.Supervisor.Tests/Lumina.Supervisor.Tests.csproj -c Release --no-restore --no-build

      - name: Constitution tests
        run: node --test tests/constitution/g0.test.mjs tests/constitution/g3.test.mjs

      - name: Dependency and packaging boundary audit
        shell: pwsh
        run: ./eng/g0-windows-audit.ps1
