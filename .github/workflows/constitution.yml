name: constitution
on:
  push:
  pull_request:
jobs:
  g0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: G0 constitution tests
        run: node --test tests/constitution/g0.test.mjs
      - name: G1 constitution tests
        run: node --test tests/constitution/g1.test.mjs tests/constitution/g1-physical.test.mjs tests/constitution/g1-hardening.test.mjs bench/scripts/parsers.test.mjs
      - name: Verify vendor pin files
        run: node bench/scripts/verify-pins.mjs
